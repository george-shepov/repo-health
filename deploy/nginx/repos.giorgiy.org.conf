# Reverse-proxy fragment for the existing Nginx edge.
# Install this in the VPS edge configuration after DNS points
# repos.giorgiy.org -> 104.237.11.29, then issue the certificate with certbot.
#
# certbot --nginx -d repos.giorgiy.org
#
# Keep the app bound to 127.0.0.1:8091; do not publish it directly.

server {
    listen 80;
    server_name repos.giorgiy.org;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Certbot adds the listen 443 ssl block and certificate paths.
# The application page is https://repos.giorgiy.org/health.
server {
    listen 443 ssl http2;
    server_name repos.giorgiy.org;

    ssl_certificate /etc/letsencrypt/live/repos.giorgiy.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/repos.giorgiy.org/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:8091;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
