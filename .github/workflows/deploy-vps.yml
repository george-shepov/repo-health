name: Deploy to VPS
on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "GHCR image tag to deploy"
        required: true
        default: latest
permissions:
  contents: read
  packages: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          test -n "$VPS_SSH_KEY"
          test -n "$VPS_HOST"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts
      - name: Install deployment files
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          REPO_HEALTH_ADMIN_TOKEN: ${{ secrets.REPO_HEALTH_ADMIN_TOKEN }}
          REPO_HEALTH_GITHUB_TOKEN: ${{ secrets.REPO_HEALTH_GITHUB_TOKEN }}
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          test -n "$VPS_USER"
          test -n "$REPO_HEALTH_ADMIN_TOKEN"
          test -n "$REPO_HEALTH_GITHUB_TOKEN"
          ssh "$VPS_USER@$VPS_HOST" 'mkdir -p /opt/repo-health'
          scp docker-compose.production.yml "$VPS_USER@$VPS_HOST:/opt/repo-health/docker-compose.production.yml"
          ssh "$VPS_USER@$VPS_HOST" "cat > /opt/repo-health/.env <<EOF
          IMAGE_TAG=$IMAGE_TAG
          GITHUB_OWNER=george-shepov
          GITHUB_TOKEN=$REPO_HEALTH_GITHUB_TOKEN
          ADMIN_TOKEN=$REPO_HEALTH_ADMIN_TOKEN
          EOF
          cd /opt/repo-health && docker compose -f docker-compose.production.yml pull && docker compose -f docker-compose.production.yml up -d
          curl --fail --silent --show-error http://127.0.0.1:8091/api/health"
